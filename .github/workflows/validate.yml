name: Kalender prüfen
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  calendar:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: python3 scripts/build_calendar.py
      - run: python3 scripts/verify_calendar.py
      - run: node --check app.js
      - run: git diff --exit-code -- index.html '*.ics'
